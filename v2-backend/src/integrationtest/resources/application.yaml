spring:
  testcontainers:
    dynamic-property-registry-injection: allow
  application:
    name: mw-planner-integration-test
  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: 1s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  threads:
    virtual:
      enabled: true

# RabbitMQ Configuration for Integration Tests
rabbitmq:
  inventory:
    exchange:
      name: inventory.test.exchange
    queue:
      name: inventory.test.queue
  brand:
    exchange:
      name: brand.test.exchange
    queue:
      name: brand.test.queue

# Brand Library Configuration for Integration Tests
brand-lib:
  file:
    allowed-extensions: .jpg,.jpeg,.png

# AWS S3 Configuration for Integration Tests
aws:
  s3:
    planner:
      access-key: minioadmin
      secret-key: minioadmin
      region: us-east-1
      bucket-name: mw-planner-local
      parent-directory: /attachments
    brand:
      bucket-name: brand-logo-bucket
      parent-directory: /local/logos

# MW Planner Configuration for Integration Tests
mw-planner:
  # =========================
  # MASTER DATA SERVICE CONFIGURATION
  # =========================
  master-data:
    base-url: https://dummy-url.com
    endpoints:
      country: /master/api/v2/rest/country
    defaults:
      page-size: 500
      page-number: 0

  # =========================
  # INFLUENCE SERVICE CONFIGURATION
  # =========================
  influence:
    base-url: https://dummy-url.com
    endpoints:
      reach-and-frequency: /v2/reach-and-frequency

  # =========================
  # ACCOUNT SERVICE CONFIGURATION
  # =========================
  account:
    base-url: https://dummy-url.com
    endpoints:
      login: /auth/login
      account: /uaa/api/account

  # =========================
  # COMPANY SERVICE CONFIGURATION
  # =========================
  company:
    base-url: https://dummy-url.com/uaa/api
    endpoints:
      children: /company/{companyId}/children
      subscription: /v2/rest/company/{companyId}/subscription
      creation: /company

  # =========================
  # MANAGEMENT CONFIGURATION
  # =========================
  management:
    credentials:
      username: test-admin
      password: test-password

  # =========================
  # CACHE CONFIGURATION
  # =========================
  cache:
    ttl-seconds: 3600

  # =========================
  # SUPPORTED LANGUAGES
  # =========================
  supported-languages:
    - en
    - ja

  # =========================
  # Security OAUTH AUTHORIZATION CONFIGURATION
  # =========================
  iam:
    service-url: https://auth-mw.replit.app
    product-id: c54f7006-9bb7-49f4-ac3f-a801c323a615
    client-id: 9ddac6d4-7556-4d06-b0db-f6777527c5ca
    client-secret: qtsMqSACBMl7NQJgcMKmi6wcMZ-Mo2GKogFKSajyhcw=
    redirect-uri: http://localhost:4700/auth/oauth/callback
    response-type: code
    scope: read,write
    code-challenge-method: S256
    endpoints:
      userinfo: /userinfo
      userById: /api/v1/users/{userId}
      authorize: /api/v1/oauth/authorize
      token: /api/v1/oauth/token
      logout: /api/v1/auth/logout

  # =========================
  # SCHEDULER CONFIGURATION
  # =========================
  scheduler:
    campaign-status-update:
      cron: "0 0 0 * * ?" # Daily at midnight (00:00:00)