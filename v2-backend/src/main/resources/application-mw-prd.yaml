# MW Planner Configuration
mw-planner:
  # =========================
  # MASTER DATA SERVICE CONFIGURATION
  # =========================
  master-data:
    base-url: https://mw-api-gtwy-prd.movingwalls.com/master/api/v2/rest
    endpoints:
      country: /country
      state: /state
      district: /district
    defaults:
      page-size: 5000
      page-number: 0

  # =========================
  # INFLUENCE SERVICE CONFIGURATION
  # =========================
  influence:
    base-url: https://mw-data-frequency.movingwalls.com
    endpoints:
      reach-and-frequency: /v2/reach-and-frequency

  # =========================
  # ACCOUNT SERVICE CONFIGURATION
  # =========================
  account:
    base-url: https://mw-api-gtwy-prd.movingwalls.com
    endpoints:
      login: /auth/login
      account: /uaa/api/account

  # =========================
  # COMPANY SERVICE CONFIGURATION
  # =========================
  company:
    base-url: https://mw-api-gtwy-prd.movingwalls.com/uaa/api
    endpoints:
      children: /company/{companyId}/children
      subscription: /v2/rest/company/{companyId}/subscription
      creation: /company

  # =========================
  # MANAGEMENT CONFIGURATION
  # =========================
  management:
    credentials:
      username: admin
      password: ac412243-acc5-4d05-93df-bf768577e69d

  # =========================
  # CACHE CONFIGURATION
  # =========================
  cache:
    ttl-seconds: 3600

  # ==========================================
  # CAMPAIGN PERFORMANCE BACKFILL (one-time)
  # ==========================================
  performance-backfill:
    batch-size: 50
    max-concurrent-measure-calls: 5
    lock-ttl-seconds: 7200
    job-status-ttl-seconds: 604800

