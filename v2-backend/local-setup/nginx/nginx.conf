events {}

http {
    upstream mw_planner {
        server mw-planner:10000;
    }

    # Allow larger client uploads to avoid 413 errors
    client_max_body_size 2G;

    # HTTP → HTTPS Redirect
    server {
        listen 80;
        server_name planner.stg.api.movingwalls.com;
        return 301 https://$host$request_uri;
    }

    # SSL Server Block
    server {
        listen 443 ssl;
        server_name planner.stg.api.movingwalls.com;

#        ssl_certificate     /etc/nginx/ssl/planner.crt;
#        ssl_certificate_key /etc/nginx/ssl/planner.key;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://mw_planner;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            return 200 "OK\n";
        }
    }

    # Admin Console (HTTP Only)
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://mw-planner:8100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            return 200 "OK\n";
        }
    }
}
