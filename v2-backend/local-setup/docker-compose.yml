#version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/apps/git/mw-planner/local-setup/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/planner.stg.api.movingwalls.com/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/planner.stg.api.movingwalls.com/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - mw-planner
      - minio
      - grafana
      - prometheus
      - mongoexpress
      - rabbitmq
    networks:
      - backend

  mw-planner:
    image: gitlab.movingwalls.com:5050/moving-walls/backend/mw-planner:${ENV}-latest
    container_name: mw-planner
    restart: unless-stopped
    environment:
      - ENV=${ENV}
      - SPRING_PROFILES_ACTIVE=${ENV}
    ports:
      - "8080:10000"
      - "8100:8100"
    depends_on:
      mongodb:
        condition: service_started
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - backend

  redis-server:
    image: redis:7.4-alpine
    container_name: redis-server
    command: redis-server
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: s3
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    command: server /data --console-address ":9001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - backend

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set mw http://minio:9000 admin admin123;
      /usr/bin/mc rm -r --force mw/brand-logo-bucket;
      /usr/bin/mc mb --region --region=us-east-1 mw/brand-logo-bucket;
      /usr/bin/mc anonymous set download mw/brand-logo-bucket;
      /usr/bin/mc rm -r --force mw/mw-planner-local;
      /usr/bin/mc mb --region --region=us-east-1 mw/mw-planner-local;
      /usr/bin/mc anonymous set download mw/mw-planner-local;
      /usr/bin/mc rm -r --force mw/mw-creative-assets;
      /usr/bin/mc mb --region --region=us-east-1 mw/mw-creative-assets;
      /usr/bin/mc anonymous set download mw/mw-creative-assets;
      /usr/bin/mc rm -r --force mw/test-bucket;
      /usr/bin/mc mb --region --region=us-east-1 mw/test-bucket;
      /usr/bin/mc anonymous set download mw/test-bucket;
      exit 0;
      "
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - backend

  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "0:0"
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "13000:13000"
    links:
      - prometheus
      - loki
    volumes:
      - ./grafana-boards/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana-boards/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
    networks:
      - backend

  mongoexpress:
    image: mongo-express:latest
    container_name: mongoexpress
    restart: always
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXP_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXP_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend

volumes:
  s3_data:
    driver: local
  mongo_data:
    driver: local
  rabbitmq_data:
    driver: local
  loki_data:
    driver: local

networks:
  backend:
    name: backend
    driver: bridge
